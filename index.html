<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let page='materials',tab='types',query='',editing=null,upload='',uploadName='';
function rule(id){return rules.find(r=>r.id===id)||{id:'',name:'待关联成长节点',member:'待关联',days:'—',scope:''}}function type(id){return db.types.find(t=>t.id===id)||db.types[0]}function pill(s){return `<span class="badge ${s==='已上架'||s==='生效中'?'green':s==='草稿'||s==='已停用'?'gray':'gold'}">${esc(s)}</span>`}function toast(s){$('#toast').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2600)}function closeModal(){$('#modal').innerHTML=''}
const titles={materials:['权益类型与素材管理','维护权益类型和素材资源，开放方式在成长权益或运营策略中配置。'],delivery:['日常运营权益','选择铁盒物料或引用现有装扮 ID，配置投放范围、排期与权益标。'],resources:['资源位配置','其他运营资源位优先展示；无符合条件的运营资源位时，再展示自动上新轻提示。']};
const defaultNewArt='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" rx="24" fill="#343025"/><rect x="31" y="35" width="66" height="85" rx="7" fill="#8d7856" transform="rotate(-12 64 78)"/><rect x="57" y="39" width="65" height="87" rx="7" fill="#e5d1a8" transform="rotate(10 90 82)"/><path d="m89 60 5 13 14 1-11 9 3 14-11-8-12 8 4-14-11-9 14-1z" fill="#8d7856"/></svg>`);
let autoNewArt='';let autoNewEnabled=true;
function autoNewPreview(src=autoNewArt){return `<div style="display:flex;align-items:center;gap:16px;padding:20px;border-radius:12px;background:#191918;color:#dfc99b"><img src="${src||defaultNewArt}" alt="上新提示素材图" style="width:64px;height:64px;object-fit:cover;border-radius:10px" onerror="this.onerror=null;this.src=defaultNewArt"><div style="flex:1"><b style="font-size:18px">你的收藏上新了</b><p style="color:#a9a18f;font-size:13px;margin-top:5px">新增 3 款 · 预览示例数量</p></div><b>去看看 ›</b></div>`}
function autoNewArtEditor(){let draft=autoNewArt;$('#modal').innerHTML=`<div class="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-label="自动上新提示素材图"><div class="drawer-head"><h2>自动上新提示 · 更换素材图</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><div class="notice">统一模板：默认使用一张通用素材图，物料上架后随符合条件的上新自动展示，可在列表中独立停用。换图只改变外观，不改变上新资格、排期、数量或优先级。</div>${field('上传替换图','<input id="autoArtFile" type="file" accept="image/png,image/jpeg,image/webp">','可选：PNG / JPG / WebP，最大 5 MB。未替换时使用统一默认图；示例图待设计正式交付。')}<div id="autoArtError" class="hint" role="status"></div><div id="autoArtPreview" style="margin:20px 0"></div><button id="autoArtReset">恢复默认图</button><p class="hint" style="margin-top:20px">全局统一图片，覆盖铁盒物料和装扮上新提示。动态数量来自权益侧；点击位置按新增内容归属确定。其他运营资源位始终优先。</p></div><div class="drawer-foot"><span class="subtle">本地原型，刷新重置</span><button class="right" onclick="closeModal()">取消</button><button class="primary" id="autoArtSave">保存素材图</button></div></div></div>`;const preview=()=>$('#autoArtPreview').innerHTML=autoNewPreview(draft);preview();let request=0;$('#autoArtFile').onchange=e=>{const version=++request,f=e.target.files[0];$('#autoArtSave').disabled=false;if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024){$('#autoArtError').textContent='请选择 5 MB 以内的 PNG / JPG / WebP 图片，原图未变。';e.target.value='';return}$('#autoArtSave').disabled=true;const reader=new FileReader();const fail=()=>{if(version!==request||!$('#autoArtSave'))return;$('#autoArtError').textContent='图片读取失败，原图未变，请重新上传。';$('#autoArtSave').disabled=false};reader.onerror=fail;reader.onload=()=>{const img=new Image();img.onerror=fail;img.onload=()=>{if(version!==request||!$('#autoArtSave'))return;draft=reader.result;$('#autoArtError').textContent=f.name+' · '+img.naturalWidth+' × '+img.naturalHeight;$('#autoArtSave').disabled=false;preview()};img.src=reader.result};reader.readAsDataURL(f)};$('#autoArtReset').onclick=()=>{request++;draft='';$('#autoArtFile').value='';$('#autoArtError').textContent='已恢复默认图，保存后生效。';$('#autoArtSave').disabled=false;preview()};$('#autoArtSave').onclick=()=>{request++;autoNewArt=draft;closeModal();render();toast('上新提示素材图已保存；上新及优先级规则不变（本地演示）')}}
function resourceOrderPanel(){return `<div class="panel" style="padding:22px;margin-bottom:22px"><h2>顶部运营区 · 展示顺序（固定规则）</h2><div class="grid"><div class="locked"><b>第一优先：其他运营资源位</b><p>运营手动配置内容、范围、排期和点击行为。先筛选符合当前用户资格且有效的配置，再按内部优先级选择一条。</p></div><div class="locked"><b>第二优先：自动上新轻提示</b><p>物料上架即自动触发，按当前用户、艺人、会员及成长资格筛选；不要求另建引导投放。运营可独立停用提示。</p></div></div><p style="margin-top:15px">无符合条件的运营资源位，且自动提示已启用、有符合资格的上新物料时，才显示上新轻提示；两者都没有时隐藏此区域。</p><p class="hint" style="margin-top:8px">运营资源位占用期间不清除上新状态；退出展示后，仍满足条件的上新轻提示继续展示。停用自动提示只隐藏引导，不影响物料上架、领取、使用或 NEW 状态；重新启用仅重新判断当前仍有效的上新，不重置已读、曝光和有效期。物料标的展示与消除仍由权益侧独立管理。</p><div class="locked" style="margin-top:15px"><div style="display:flex;align-items:center;margin-bottom:15px"><b>自动上新轻提示 · 系统生成 · 无需新建</b><span class="badge ${autoNewEnabled?'green':'gray'}" style="margin-left:12px">${autoNewEnabled?'已启用':'已停用 · 前台不展示'}</span><button class="right" onclick="autoNewArtEditor()">更换上新素材图</button><button style="margin-left:8px" onclick="autoNewEnabled=!autoNewEnabled;render();toast(autoNewEnabled?'已启用：重新判断当前有效上新':'已停用提示，物料和 NEW 状态不变')">${autoNewEnabled?'停用上新提示':'启用上新提示'}</button></div>${autoNewPreview()}<p class="hint" style="margin:12px 0">${autoNewArt?'当前使用运营替换图':'当前使用统一默认图（示意）'} · 跟随物料上架自动展示 · 无独立投放排期</p><p>「你的收藏上新了 · 新增 N 款」：N 读取当前艺人、会员身份和成长阶段下可用的新增权益；点击定位「铁盒里的珍藏」或「我的守护装扮」。</p></div></div>`}
let selectedAssetType='';
// Display categories belong to one material type; their IDs survive a rename.
const groupCatalog=new Map();
function materialGroups(typeId){
 if(!groupCatalog.has(typeId))groupCatalog.set(typeId,[{id:'general',name:'热门'}]);
 return groupCatalog.get(typeId);
}
function assignedGroup(asset){return materialGroups(asset.type).find(g=>g.id===asset.groupId)||materialGroups(asset.type)[0]}
function manageGroups(){
 const groups=materialGroups(selectedAssetType);
 const draw=()=>{
  $('#modal').innerHTML='<div class="overlay"><div class="drawer"><div class="drawer-head"><h2>'+esc(type(selectedAssetType).name)+' · 素材分类</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><p class="hint">分类名称和顺序用于前端展示。可只保留一个分类，如「热门」或「最新」。</p><div id="groupRows"></div><button id="addGroup">＋ 添加分类</button></div><div class="drawer-foot"><button class="primary right" id="saveGroups">保存分类</button></div></div></div>';
  const append=(group)=>{const line=document.createElement('div');line.className='field';const entry=document.createElement('input');entry.dataset.group=group.id;entry.value=group.name;entry.placeholder='例如：生日限定、圣诞';line.append(entry);$('#groupRows').append(line);return entry};
  groups.forEach(append);$('#addGroup').onclick=()=>append({id:'group-'+crypto.randomUUID(),name:''}).focus();
  $('#saveGroups').onclick=()=>{const next=[...document.querySelectorAll('#groupRows input')].map(e=>({id:e.dataset.group,name:e.value.trim()}));
   if(next.some(g=>!g.name)||new Set(next.map(g=>g.name)).size!==next.length){toast('请填写分类名称，同一类型内不能重名');return}
   groupCatalog.set(selectedAssetType,next);closeModal();render()}
 };draw();
}
function groupPreview(){
 const assets=db.assets.filter(a=>a.type===selectedAssetType&&a.status==='已上架');
 const groups=materialGroups(selectedAssetType).filter(g=>assets.some(a=>assignedGroup(a).id===g.id));
 $('#modal').innerHTML='<div class="overlay"><div class="drawer"><div class="drawer-head"><h2>'+esc(type(selectedAssetType).name)+' · 前端分类预览</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><div class="tabs" id="previewGroups"></div><div id="previewItems"></div></div></div></div>';
 function show(id){$('#previewGroups').innerHTML=groups.map(g=>'<button data-preview="'+g.id+'" class="'+(g.id===id?'active':'')+'">'+esc(g.name)+'</button>').join('');
 $('#previewItems').innerHTML=assets.filter(a=>assignedGroup(a).id===id).map(a=>'<div style="display:inline-grid;gap:6px;padding:12px">'+materialImage(a)+'<b>'+esc(a.name)+'</b></div>').join('')||'<p class="empty">暂无已上架素材</p>';document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>show(b.dataset.preview))}show(groups[0]?.id)
}
function bindAssetGroup(r){
 const source=$('#type'),host=document.createElement('div');source.closest('.field').after(host);
 const draw=()=>{const groups=materialGroups(source.value);host.innerHTML=field('素材分类',select('groupId',groups.map(g=>[g.id,g.name]),r.type===source.value?assignedGroup(r).id:groups[0].id),'在该物料类型下展示的前端分类。')};source.addEventListener('change',draw);draw();
}
function materialTypeTabs(){

function saveGrowth(draft){const t=type($('#gType').value),growthKey=t.category==='box'?t.id+'@'+$('#gDay').value:t.id,old=db.growth[growthKey],assets=[...document.querySelectorAll('[name=baseAsset]:checked')].map(e=>e.value);const ruleId=(t.template==='外显装扮'?'COMMON_D':'DIY_D')+$('#gDay').value;const aud=$('#aud').value,pack=aud==='指定人群'?$('#pack').value:'',artistMode=$('#artistMode').value,artists=artistMode==='指定艺人'?[...new Set($('#artists').value.split(/[\s,，]+/).filter(Boolean))].join(','):'';const errors=[];if(!$('#markText').value.trim()||Array.from($('#markText').value.trim()).length>8)errors.push('请填写 1—8 个字符的标文案。');if(artistMode==='指定艺人'&&(!artists||!artists.split(',').every(a=>/^\d+$/.test(a))))errors.push('请填写有效艺人 ID。');if(old?.status==='已发布'&&draft){toast('已发布配置请直接发布更新，不能降为草稿');return}if(old?.status==='已发布'&&old.assets.some(id=>!assets.includes(id)))errors.push('已生效基础素材不可直接移除；本原型仅支持补充。');if(!draft){if(!assets.length)errors.push('请选择至少一款基础素材。');if(t.status!=='已上架')errors.push('请先在物料管理中上架此类型。');if(assets.some(id=>db.assets.find(a=>a.id===id)?.status!=='已上架'))errors.push('所选基础素材必须全部上架。');if(assets.some(id=>db.deliveries.some(d=>d.status!=='草稿'&&d.status!=='已停用'&&d.mode==='指定素材'&&d.assets.includes(id))))errors.push('所选素材正在运营投放，请先停用对应投放再设为基础素材。')}if(errors.length){$('#growthErrors').innerHTML='<div class="error">'+errors.map(esc).join('<br>')+'</div>';$('.drawer-body').scrollTop=0;return}db.growth[growthKey]={type:t.id,rule:ruleId,assets,aud,pack,artistMode,artists,markKind:'梯度解锁标',markText:$('#markText').value.trim(),status:draft?'草稿':'已发布'};if(!draft){if(t.category==='box')assets.forEach(id=>db.assets.find(a=>a.id===id).rule=ruleId);else t.rule=ruleId}closeModal();renderGrowth();toast(draft?'成长配置草稿已保存':'成长权益已发布：用户达标后基础素材自动可用（本地演示）')}


function saveResource(r,draft){const errors=[];if(!r.name)errors.push('请填写配置名称。');if(!draft){if(!r.title||!r.button)errors.push('请填写展示文案与按钮文案。');if(r.style==='活动卡片'&&(!r.image||!r.tag||!r.sub))errors.push('活动卡片需要图片、标签与副标题。');if(r.action==='链接跳转'&&!/^(https:\/\/[^\s/]+|orpheus:\/\/[^\s]+)/.test(r.url))errors.push('请填写有效的 https:// 或 orpheus:// 链接。');if(r.action==='页内定位'&&!['铁盒里的珍藏','我的守护装扮'].includes(r.target))errors.push('请选择定位模块。');validateRange(r,errors);if(!/^\d+$/.test(r.priority)||+r.priority>999)errors.push('优先级须为 0—999 的整数。');}if(errors.length){$('#errors').innerHTML='<div class="error">'+errors.map(esc).join('<br>')+'</div>';$('.drawer-body').scrollTop=0;return}if(r.action==='页内定位')r.url='';else r.target='';if(r.style==='轻提示'){r.image='';r.tag='';r.sub=''}if(draft)commit(r,true);else publishReview(r)}
function validateRange(r,e){if(!r.start||!r.end||r.end<=r.start)e.push('结束时间必须晚于开始时间。');if(r.end&&new Date(r.end+'+08:00')<=new Date())e.push('结束时间必须晚于当前时间。');if(r.artistMode==='指定艺人'&&(!r.artists||!r.artists.split(',').every(a=>/^\d+$/.test(a))))e.push('请填写有效艺人 ID，仅数字，支持逗号、空格或换行。')}
function resourceSimulator(r){$('#modal').innerHTML=`<div class="overlay"><div class="drawer"><div class="drawer-head"><h2>资源位资格预览</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><div class="notice">模拟展示资格，不查询真实用户，不改变物料状态。</div>${field('命中人群、艺人范围及展示排期',select('srRange',['是','否'],'是'))}${field('用户会员',select('srMember',['非会员','VIP','SVIP'],'SVIP'))}${field('目标模块存在符合资格的物料',select('srMaterial',['是','否'],'是'))}<p class="hint">${esc(r.qualModule)} · ${esc(r.eligibility)}；物料资格由物料服务返回，和 NEW 状态无关。</p><div id="srResult" style="margin-top:20px"></div></div></div></div>`;const calc=()=>{const ok=$('#srRange').value==='是'&&(r.member==='不限'||(r.member==='VIP / SVIP'?$('#srMember').value!=='非会员':$('#srMember').value==='SVIP'))&&(r.eligibility==='仅按上述范围展示'||$('#srMaterial').value==='是');$('#srResult').innerHTML=ok?'<div class="success">符合展示资格</div><div class="preview">'+promo(r)+'</div>':'<div class="rule-result">不展示资源位：范围、会员或物料资格未满足。</div>'};['srRange','srMember','srMaterial'].forEach(id=>$('#'+id).onchange=calc);calc()}

function renderBackgrounds(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#main').innerHTML=`<div class="crumb">艺粉商业化 / 守护页背景配置</div><div class="heading"><div><h1>守护页背景配置</h1><p class="desc">按艺人 ID 投放守护页背景，独立于用户物料、资源位和 NEW 标。</p></div><button class="primary right" onclick="backgroundEditor()">＋ 新建背景配置</button></div><div class="notice">每个艺人仅允许一条背景配置（含草稿、停用及已结束）。已有配置只能编辑，不能重复新增；到期或停用后恢复默认背景。批量新建将按艺人分别生成配置，后续独立修改。</div><div class="panel">${backgrounds.length?backgrounds.map(r=>`<div class="resource-card"><div style="height:220px;background:#20252e;border-radius:8px;overflow:hidden">${r.image?`<img src="${r.image}" style="width:100%;height:100%;object-fit:cover;object-position:center top" alt="背景预览">`:''}</div><div><h2>${esc(r.name)}</h2>${pill(backgroundStatus(r))}<dl class="kv"><dt>艺人 ID</dt><dd>${esc(r.artists)}</dd><dt>生效时间</dt><dd>${esc(r.start)} 至 ${esc(r.end)}</dd></dl><button onclick="backgroundEditor('${r.id}')">编辑</button> <button onclick="toggleBackground('${r.id}')">${r.status==='已停用'?'转为草稿':'停用'}</button></div></div>`).join(''):'<div class="empty">尚未配置运营背景，守护页展示默认背景。<br>点击「新建背景配置」，上传图片并圈选艺人 ID。</div>'}</div><p class="mini" style="margin-top:16px">本地交互原型，刷新后重置；艺人 ID 仅校验格式，正式发布需对接艺人有效性校验。</p>`}

function backgroundEditor(id){const r=backgrounds.find(x=>x.id===id)||{};let bgImage=r.image||'';$('#modal').innerHTML=`<div class="overlay"><div class="drawer"><div class="drawer-head"><h2>${id?'编辑':'新建'}守护页背景</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><div id="bgErrors"></div>${section('01','背景内容',field('配置名称',input('bgName',r.name,'例如：艺人生日限定背景'))+field('背景图片','<input id="bgFile" type="file" accept="image/png,image/jpeg,image/webp">','PNG / JPG / WebP，最大 5 MB；建议竖版高清图，主体避免靠近边缘。')+'<div id="bgPreview"></div>')}${section('02','圈选艺人',field('艺人 ID',`<textarea id="bgArtists" placeholder="输入艺人 ID，支持逗号、空格或换行">${esc(r.artists||'')}</textarea>`,'新建支持批量输入；每个艺人独立保存。已有配置请直接编辑，编辑时艺人 ID 不可更换。')+'<div id="bgCount" class="hint"></div>')}${section('03','生效排期',timing(r))}<div class="locked">图片顶部居中铺满，随屏幕比例裁切；上传后可预览示意效果。正式页面需按实际尺寸验收。</div></div><div class="drawer-foot"><span class="subtle">本地演示，不提交线上</span><button class="right" id="bgDraft">保存草稿</button><button class="primary" id="bgPublish">发布背景</button></div></div></div>`;const preview=()=>{$('#bgPreview').innerHTML=`<div style="width:260px;height:350px;margin:auto;position:relative;border-radius:20px;overflow:hidden;background:#20252e">${bgImage?`<img src="${bgImage}" alt="守护页背景预览" style="width:100%;height:100%;object-fit:cover;object-position:center top">`:''}<div style="position:absolute;inset:0;padding:25px;color:white;background:linear-gradient(#0003,#0001,#0009)"><small>‹　专属守护</small><h2 style="margin-top:80px">艺人守护页</h2><p>背景效果示意</p></div></div>`};preview();$('#bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5*1024*1024){toast('请上传 5 MB 以内 PNG / JPG / WebP 图片');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{bgImage=reader.result;preview()};img.onerror=()=>toast('图片无法解码，请重新上传');img.src=reader.result};reader.readAsDataURL(f)};const ids=()=>[...new Set($('#bgArtists').value.split(/[\s,，]+/).filter(Boolean))];if(id)$('#bgArtists').disabled=true;const conflicts=()=>backgrounds.filter(x=>x.id!==id&&x.artists.split(',').some(a=>ids().includes(a)));$('#bgArtists').oninput=()=>{$('#bgCount').innerHTML='已圈选 '+ids().length+' 个艺人 ID'+conflicts().map(x=>`<div class="error">艺人 ${esc(x.artists)} 已有背景配置。<button type="button" class="link" data-existing-bg="${esc(x.id)}">编辑已有配置</button></div>`).join('');document.querySelectorAll('[data-existing-bg]').forEach(b=>b.onclick=()=>backgroundEditor(b.dataset.existingBg))};$('#bgArtists').oninput();const saveBg=draft=>{const row={id:id||'BG'+Date.now(),name:$('#bgName').value.trim(),image:bgImage,artists:ids().join(','),artistMode:'指定艺人',start:$('#start').value,end:$('#end').value,status:draft?'草稿':'已发布',publishedAt:Date.now()};const errors=[];if(!row.name)errors.push('请填写配置名称。');if(!row.artists||!ids().every(a=>/^\d+$/.test(a)))errors.push('请填写有效艺人 ID。');if(conflicts().length)errors.push('所选艺人已有背景配置，只能编辑已有配置，不能新增。');if(!draft){if(!row.image)errors.push('请上传背景图片。');validateRange(row,errors);if(!/^\d+$/.test(row.priority)||+row.priority>999)errors.push('优先级须为 0—999 的整数。')}if(errors.length){$('#bgErrors').innerHTML='<div class="error">'+errors.map(esc).join('<br>')+'</div>';$('.drawer-body').scrollTop=0;return}const i=backgrounds.findIndex(x=>x.id===id);if(i<0)ids().forEach((artist,j)=>backgrounds.push({...row,id:row.id+'-'+j,artists:artist}));else backgrounds[i]=row;closeModal();renderBackgrounds();toast(draft?'背景草稿已保存':'背景配置已发布（本地演示）')};$('#bgDraft').onclick=()=>saveBg(true);$('#bgPublish').onclick=()=>saveBg(false)}
