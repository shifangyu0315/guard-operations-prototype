var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;

// Each category has its own cursor; a round consumes at most two entries per category.
function nextFallback(current,future,visit){
 const signature=JSON.stringify([current,future]);
 if(visit.signature!==signature){visit.signature=signature;visit.currentCursor=0;visit.futureCursor=0;visit.queue=[];visit.index=0;visit.round=0}
 if(current.length+future.length===1){visit.round=1;return current.length?{...current[0],future:false}:{...future[0],future:true}}
 if(!visit.queue.length||visit.index>=visit.queue.length){
  visit.queue=[];visit.index=0;visit.round++;
  for(const [rows,key,isFuture] of [[current,'currentCursor',false],[future,'futureCursor',true]]){
   for(let i=0;i<Math.min(2,rows.length);i++)visit.queue.push({...rows[(visit[key]+i)%rows.length],future:isFuture});
   if(rows.length)visit[key]=(visit[key]+Math.min(2,rows.length))%rows.length;
  }
 }
 return visit.queue[visit.index++]||null;
}

function bindAssetImageInputs(asset){
 for(const {key,label} of assetImageRoles()){
  const input=$('#asset-'+key),preview=$('#preview-'+key);
  preview.dataset.url=asset[key]||'';
  preview.dataset.name=asset[imageNameKey(key)]||'';
  const draw=()=>{if(key==='video'){preview.innerHTML=preview.dataset.url?`<video src="${esc(preview.dataset.url)}" controls muted loop playsinline style="display:block;max-width:100%;max-height:240px;margin:8px 0"></video><span class="hint">${esc(preview.dataset.name)}</span>`:'<div class="locked subtle">尚未上传视频</div>';return}preview.innerHTML=preview.dataset.url?`<img src="${esc(preview.dataset.url)}" alt="${label}" style="max-width:180px;max-height:150px;display:block;margin:8px 0"><span class="hint">${esc(preview.dataset.name)}</span>`:`<div class="locked subtle">尚未上传${label}</div>`};
  draw();
  let revision=0;
  input.onchange=()=>{
   const version=++revision,file=input.files[0];
   delete preview.dataset.loading;
   if(!file)return;
   if(key==='video'&&(!['video/mp4','video/webm'].includes(file.type)||file.size>50*1024*1024)){input.value='';toast('请选择 50 MB 以内的 MP4 或 WebM 视频');return}
   if(key!=='video'&&(!['image/png','image/jpeg','image/webp','image/svg+xml'].includes(file.type)||file.size>5*1024*1024)){input.value='';toast('请选择 5 MB 以内的 PNG、JPG、WebP 或 SVG 图片');return}
   const reader=new FileReader();
   preview.dataset.loading='1';
   reader.onload=()=>{if(version!==revision)return;preview.dataset.url=reader.result;preview.dataset.name=file.name;delete preview.dataset.loading;draw()};
   reader.onerror=()=>{if(version!==revision)return;delete preview.dataset.loading;input.value='';toast(label+'读取失败，请重新上传')};
   reader.readAsDataURL(file);
  };
 }
}

 const chosen=new Map(records.map(([key,g])=>[g.type,{key,old:g,assets:new Set(g.assets)}]));
 const dresses=dressGrowth.filter(g=>g.days===days), dressIds=new Set(dresses.flatMap(g=>g.dressIds));
 const numbers=numericGrowth.filter(g=>g.days===days);
 let dirty=false;
 const scopeRows=new Map();
 const scopeUI=(key,old={})=>{
  if(!scopeRows.has(key))scopeRows.set(key,{aud:old.aud||'全部用户',pack:old.pack||'',artistMode:old.artistMode||'全部艺人',artistId:old.artistId||''});
  const r=scopeRows.get(key);
  return `<div data-row-scope="${esc(key)}" style="margin-top:16px"><label style="display:block;margin-top:12px"><input type="checkbox" data-limit="artistMode" ${r.artistMode==='艺人圈选'?'checked':''}> 限制艺人范围</label><div data-scope-artist ${r.artistMode==='艺人圈选'?'':'hidden'}><textarea aria-label="艺人 ID" data-scope-field="artistId" rows="3" placeholder="输入一个或多个艺人 ID，用逗号或换行分隔">${esc(r.artistId)}</textarea><p class="hint">不支持艺人包。</p></div></div>`;
 };
 const bindScopes=()=>document.querySelectorAll('[data-row-scope]').forEach(el=>{
  const r=scopeRows.get(el.dataset.rowScope);
  el.querySelectorAll('[data-limit]').forEach(e=>e.onchange=()=>{r.artistMode=e.checked?'艺人圈选':'全部艺人';el.querySelector('[data-scope-artist]').hidden=!e.checked;dirty=true});
  el.querySelectorAll('[data-scope-field]').forEach(e=>e.oninput=()=>{r[e.dataset.scopeField]=e.value;dirty=true});
 });
 const savedScope=(key,errors)=>{const r=scopeRows.get(key)||{},v={aud:'全部用户',pack:'',artistMode:r.artistMode||'全部艺人',artistId:r.artistMode==='艺人圈选'?parseArtistIds(r.artistId).join(', '):''};validateArtistScope(v,errors);return {...v,markKind:'',markText:''}};

 const earlier=t=>Object.values(db.growth).filter(g=>g.type===t&&g.status==='已发布'&&rule(g.rule).days<days).flatMap(g=>g.assets);
 const elsewhere=id=>Object.values(db.growth).find(g=>rule(g.rule).days!==days&&g.assets.includes(id));
 const emptyMaterialRows={box:0,diy:0,sticker:0,text:0};
 const liveTypes=db.types.filter(t=>t.valueKind!=='number'&&(t.status==='已上架'||chosen.has(t.id)));
 $('#modal').innerHTML=`<div class="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-label="按节点配置成长权益"><div class="drawer-head"><h2>配置成长权益</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><div id="nodeErrors" role="alert"></div>${field('成长节点',select('nodeDay',stages.map(n=>[String(n.days),n.label]),String(days)))}<div class="notice">各类权益均为选填。选择物料类型后，勾选本节点新增解锁的具体样式；此前已解锁的样式继续可用，无需重复选择。上传新素材不会自动加入已配置节点。</div>${['box','diy','sticker','text'].map((cat,i)=>section('0'+(i+1),displayCategories[cat]+' · 选填','<div id="nodeMaterials-'+cat+'"></div>')).join('')}${section('05','装扮权益 · 选填','<p class="hint">选择装扮类型，手动填写装扮 ID 进行关联。会员范围和最低节点沿用装扮自身门槛。</p><div id="nodeDress"></div>')}${section('06','铁盒名额 · 选填',db.types.filter(t=>t.valueKind==='number').map(t=>field(t.name+'（选填）',`<select aria-label="名额类型" data-number-type="${esc(t.id)}" ${numbers.some(g=>g.type===t.id&&g.status==='已发布')?'disabled':''}><option value="">请选择名额类型</option><option value="${esc(t.id)}" ${numbers.some(g=>g.type===t.id)?'selected':''}>${esc(t.name)}</option></select><input aria-label="节点总上限" style="margin-top:12px;display:${numbers.some(g=>g.type===t.id)?'block':'none'}" data-node-number="${esc(t.id)}" type="number" min="1" step="1" value="${numbers.find(g=>g.type===t.id)?.value||''}" placeholder="留空则不配置"><div data-number-scope="${esc(t.id)}" ${numbers.some(g=>g.type===t.id)?'':'hidden'}>${scopeUI('number-'+t.id,numbers.find(g=>g.type===t.id))}</div>`,'填写此节点可用总上限，不是新增量；沿成长节点不递减。',false)).join(''))}</div><div class="drawer-foot"><span class="subtle">本地演示，刷新重置</span><button class="right" onclick="closeModal()">取消</button><button class="primary" id="nodeSave">保存并发布节点配置</button></div></div></div>`;
 bindScopes();
 document.querySelectorAll('[data-number-type]').forEach(e=>e.onchange=()=>{const input=document.querySelector('[data-node-number='+e.dataset.numberType+']');input.style.display=e.value?'block':'none';document.querySelector('[data-number-scope='+e.dataset.numberType+']').hidden=!e.value;if(!e.value)input.value='';dirty=true});
 const drawMaterials=()=>{
  for(const cat of ['box','diy','sticker','text']){
  const options=liveTypes.filter(t=>displayCategory(t)===cat&&!chosen.has(t.id));
  if(![...chosen].some(([id])=>displayCategory(type(id))===cat)&&!emptyMaterialRows[cat])emptyMaterialRows[cat]=1;
  const typeOptions=selected=>'<option value="">请选择物料类型</option>'+liveTypes.filter(t=>displayCategory(t)===cat&&(!chosen.has(t.id)||t.id===selected)).map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join('');
  $('#nodeMaterials-'+cat).innerHTML=[...chosen].some(([id])=>displayCategory(type(id))===cat)?[...chosen].filter(([id])=>displayCategory(type(id))===cat).map(([id,row])=>{
   const t=type(id),prior=new Set(earlier(id)),assets=db.assets.filter(a=>a.type===id);
   return `<div class="panel" style="padding:18px;margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px"><div class="field" style="flex:1;margin:0"><label>物料类型</label><select aria-label="物料类型" data-change-type="${esc(id)}" ${row.old?.status==='已发布'?'disabled':''}>${typeOptions(id)}</select></div><span class="badge">${prior.size?'继续新增样式':'本节点首次开放'}</span><button class="link right" data-remove-type="${esc(id)}" ${row.old?.status==='已发布'?'disabled':''}>移除类型</button></div><p class="hint">此前已解锁 ${prior.size} 款 · 本节点新增 ${row.assets.size} 款 · 累计 ${new Set([...prior,...row.assets]).size} 款</p><button class="link" data-select-all="${esc(id)}">全选可用素材</button><div class="checklist">${assets.map(a=>{const other=elsewhere(a.id),locked=other||a.status!=='已上架'||row.old?.status==='已发布'&&row.old.assets.includes(a.id);return `<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-node-asset="${esc(a.id)}" data-type="${esc(id)}" ${row.assets.has(a.id)?'checked':''} ${locked?'disabled':''}>${materialImage(a)}<span><b>${esc(a.name)}</b><br><span class="mini">${esc(a.id)} · ${esc(a.status)}${other?' · '+(rule(other.rule).days<days?'此前节点已关联':'后续节点已关联')+' D'+rule(other.rule).days:''}</span></span></label>`}).join('')||'<p class="hint">暂无素材，请先到素材管理上传。</p>'}</div>${scopeUI('material-'+id,row.old)}</div>`;
  }).join(''):'';
  $('#nodeMaterials-'+cat).innerHTML+=Array.from({length:emptyMaterialRows[cat]},(_,i)=>`<div class="panel" style="padding:18px;margin-bottom:16px"><label>物料类型</label><select aria-label="${displayCategories[cat]}类型" data-empty-category="${cat}">${typeOptions('')}</select><p class="hint">选择类型后显示对应素材，可留空。</p></div>`).join('')+`<button data-add-category="${cat}" ${!options.length||emptyMaterialRows[cat]?'disabled':''}>＋ 新增</button>`;
  }
  document.querySelectorAll('[data-empty-category]').forEach(e=>e.onchange=()=>{if(!e.value)return;chosen.set(e.value,{assets:new Set()});emptyMaterialRows[e.dataset.emptyCategory]--;dirty=true;drawMaterials()});
  document.querySelectorAll('[data-change-type]').forEach(e=>e.onchange=()=>{const old=e.dataset.changeType,cat=displayCategory(type(old));chosen.delete(old);if(e.value)chosen.set(e.value,{assets:new Set()});else emptyMaterialRows[cat]++;dirty=true;drawMaterials()});
  document.querySelectorAll('[data-add-category]').forEach(e=>e.onclick=()=>{emptyMaterialRows[e.dataset.addCategory]++;drawMaterials()});
  document.querySelectorAll('[data-remove-type]').forEach(b=>b.onclick=()=>{chosen.delete(b.dataset.removeType);dirty=true;drawMaterials()});
  document.querySelectorAll('[data-node-asset]').forEach(c=>c.onchange=()=>{const s=chosen.get(c.dataset.type).assets;c.checked?s.add(c.dataset.nodeAsset):s.delete(c.dataset.nodeAsset);dirty=true;drawMaterials()});
  document.querySelectorAll('[data-select-all]').forEach(b=>b.onclick=()=>{const row=chosen.get(b.dataset.selectAll);db.assets.filter(a=>a.type===b.dataset.selectAll&&a.status==='已上架'&&!elsewhere(a.id)).forEach(a=>row.assets.add(a.id));dirty=true;drawMaterials()});
 bindScopes();
 };

 drawMaterials();
 const kinds=[...new Set(dressCatalog.map(d=>d.type))];
 const dressRows=[];
 for(const g of dresses)for(const kind of kinds){const ids=g.dressIds.filter(id=>dressCatalog.find(d=>d.id===id)?.type===kind);if(ids.length)dressRows.push({type:kind,text:ids.join(', '),old:g})}
 let dressScopeSeq=0;
 if(!dressRows.length)dressRows.push({type:'',text:''});
 const drawDress=()=>{
  dressRows.forEach(row=>{if(!row.scopeKey)row.scopeKey='dress-'+(++dressScopeSeq)});
  $('#nodeDress').innerHTML=dressRows.map((row,i)=>`<div class="panel" style="padding:16px;margin-bottom:12px"><div class="grid"><div class="field"><label for="nodeDressType${i}">装扮类型</label><select id="nodeDressType${i}" data-dress-type="${i}"><option value="">请选择装扮类型</option>${kinds.map(kind=>`<option value="${esc(kind)}" ${kind===row.type?'selected':''}>${esc(kind)}</option>`).join('')}</select></div><div class="field"><label for="nodeDressIds${i}">装扮 ID</label><textarea id="nodeDressIds${i}" data-dress-ids="${i}" rows="2" placeholder="填写装扮 ID，多个 ID 用逗号或换行分隔">${esc(row.text)}</textarea></div></div>${scopeUI(row.scopeKey,row.old)}<button class="link" data-remove-dress="${i}">移除此组</button></div>`).join('')+'<button id="addNodeDress">＋ 添加装扮关联</button><p class="hint">整项选填；填写任一字段后，需同时填写类型与 ID。此处不展示装扮库。当前原型仅使用示例数据校验，正式环境需接入装扮服务。</p>';
  document.querySelectorAll('[data-dress-type]').forEach(e=>e.onchange=()=>{dressRows[Number(e.dataset.dressType)].type=e.value;dirty=true});
  document.querySelectorAll('[data-dress-ids]').forEach(e=>e.oninput=()=>{dressRows[Number(e.dataset.dressIds)].text=e.value;dirty=true});
  document.querySelectorAll('[data-remove-dress]').forEach(e=>e.onclick=()=>{dressRows.splice(Number(e.dataset.removeDress),1);dirty=true;drawDress()});
  $('#addNodeDress').onclick=()=>{dressRows.push({type:'',text:''});dirty=true;drawDress()};
 bindScopes();
 };drawDress();

 document.querySelectorAll('[data-node-number]').forEach(i=>i.addEventListener('input',()=>dirty=true));
 $('#nodeDay').onchange=()=>{const next=Number($('#nodeDay').value);if(dirty&&!confirm('切换节点会放弃尚未保存的修改，是否继续？')){$('#nodeDay').value=String(days);return}nodeGrowthEditor(next)};
 $('#nodeSave').onclick=()=>{
  const errors=[],nextMaterials=[],nextNumbers=[];
  for(const [id,row] of chosen){const t=type(id),assets=[...row.assets];
   if(!assets.length)errors.push(t.name+'：请选择至少一款样式，或移除此类型。');
   if(t.status!=='已上架')errors.push(t.name+'：类型尚未上架。');
   for(const aid of assets){const a=db.assets.find(a=>a.id===aid);if(!a||a.type!==id||a.status!=='已上架')errors.push(t.name+'：素材无效或未上架。');if(elsewhere(aid))errors.push(t.name+'：素材已关联其他节点。');if(db.deliveries.some(d=>d.status!=='草稿'&&d.status!=='已停用'&&d.mode==='指定素材'&&(d.assets||[]).includes(aid)))errors.push(t.name+'：素材正在运营投放，请先停用对应投放。');}
   nextMaterials.push([row.key||id+'@'+days,{...row.old,...savedScope('material-'+id,errors),type:id,rule:(t.memberThreshold==='VIP'?'COMMON_D':'DIY_D')+days,assets,status:'已发布'}]);
  }
  document.querySelectorAll('[data-node-number]').forEach(i=>{const id=i.dataset.nodeNumber,old=numbers.find(g=>g.type===id),value=Number(i.value),t=type(id);if(!i.value){if(document.querySelector('[data-number-type='+id+']')?.value)errors.push(t.name+'：请选择后填写总上限，或清空名额类型。');if(old?.status==='已发布')errors.push(t.name+'：已发布配置不能清空。');return}if(!Number.isSafeInteger(value)||value<1)errors.push(t.name+'：请输入正整数。');if(old?.status==='已发布'&&value<old.value)errors.push(t.name+'：已发布总上限不能降低。');if(numericGrowth.some(g=>g.type===id&&g.days!==days&&g.status==='已发布'&&(g.days<days&&g.value>value||g.days>days&&g.value<value)))errors.push(t.name+'：总上限须随节点不递减。');nextNumbers.push({...old,...savedScope('number-'+id,errors),id:old?.id||'NG'+id+'_'+days,type:id,days,value,status:'已发布'})});
  dressIds.clear();
  for(const [i,row] of dressRows.entries()){
   const ids=row.text.trim().split(/[\s,，、;；]+/).filter(Boolean);
   if(!row.type&&!ids.length)continue;
   if(!row.type||!ids.length){errors.push('装扮第 '+(i+1)+' 组：请同时填写装扮类型与装扮 ID。');continue}
   row.savedScope=savedScope(row.scopeKey,errors);
   for(const id of ids){
    if(dressIds.has(id))errors.push('装扮 '+id+'：重复填写。');
    dressIds.add(id);
    const d=dressCatalog.find(d=>d.id===id);
    if(!d)errors.push('装扮 '+id+'：示例数据中未找到，正式环境需接入装扮服务校验。');
    else if(d.type!==row.type)errors.push('装扮 '+id+'：与所选装扮类型不匹配。');
    if(dressGrowth.some(g=>g.days!==days&&g.dressIds.includes(id)))errors.push('装扮 '+id+'：已关联其他成长节点。');
   }
  }
  for(const g of dresses.filter(g=>g.status==='已发布'))if(g.dressIds.some(id=>!dressIds.has(id)))errors.push('已发布的装扮 ID 不可直接移除；可继续补充关联。');
  for(const id of dressIds){const d=dressCatalog.find(d=>d.id===id);if(!d||d.status!=='已上架'||d.days>days)errors.push('装扮 '+id+'：未上架或节点低于原有门槛。');}
  if(!chosen.size&&!dressIds.size&&!nextNumbers.length)errors.push('请至少配置一项权益后再保存；每个类型均可选填。');
  if(errors.length){$('#nodeErrors').innerHTML='<div class="error">'+[...new Set(errors)].map(esc).join('<br>')+'</div>';$('.drawer-body').scrollTop=0;return}
  // Commit only after all sections pass validation.
  for(const [key] of records)delete db.growth[key];
  for(const [key,g] of nextMaterials){db.growth[key]=g;g.assets.forEach(id=>db.assets.find(a=>a.id===id).rule=g.rule);const t=type(g.type);t.rule=Object.values(db.growth).filter(x=>x.type===t.id&&x.status==='已发布').sort((a,b)=>rule(a.rule).days-rule(b.rule).days)[0].rule;}
  numericGrowth=numericGrowth.filter(g=>g.days!==days).concat(nextNumbers);
  const retained=[];
  for(const [i,row] of dressRows.entries())for(const member of ['VIP / SVIP','SVIP']){
   const ids=row.text.trim().split(/[\s,，、;；]+/).filter(Boolean).filter(id=>dressCatalog.find(d=>d.id===id)?.member===member);
   if(ids.length)retained.push({...row.old,...row.savedScope,id:'DG'+days+'_'+Date.now()+'_'+i+'_'+member,name:ids.map(id=>dressCatalog.find(d=>d.id===id).name).join('、'),dressIds:ids,member,days,status:'已发布'});
  }
  dressGrowth=dressGrowth.filter(g=>g.days!==days).concat(retained);
  closeModal();renderGrowth();toast('节点配置已保存，按指定素材解锁（仅本地演示）');
 };
}

function growthEditor(typeId,days=1){if(typeId?.includes('@')){const parts=typeId.split('@');typeId=parts[0];days=Number(parts[1])}if(!typeId){chooseGrowth(days);return}if(numericGrowth.some(g=>g.id===typeId)){numericEditor(null,days,typeId);return}if(typeId&&type(typeId).valueKind==='number'){const existing=numericGrowth.find(g=>g.type===typeId&&g.days===days);numericEditor(typeId,days,existing?.id);return}if(dressGrowth.some(x=>x.id===typeId)){dressEditor('growth',typeId,days);return}const existing=db.growth[typeId+'@'+days]||db.growth[typeId];$('#modal').innerHTML=`<div class="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-label="成长权益配置"><div class="drawer-head"><h2>配置成长权益</h2><button class="link right" onclick="closeModal()">✕</button></div><div class="drawer-body"><div id="growthErrors"></div>${section('01','选择解锁类型',field('权益类型',select('gType',db.types.map(t=>[t.id,t.name]),typeId||db.types[0]?.id),'素材类配置首次解锁节点与基础素材；数值类按各节点配置总上限。类型由运营在权益类型管理中创建。'))}${section('02','会员身份与成长节点','<div id="gIdentity" class="locked" style="margin-bottom:15px"></div>'+field('解锁节点',select('gDay',stages.map(n=>[String(n.days),n.label]),String(existing?rule(existing.rule).days:days)))+'<p class="hint">使用已确认的九档梯度，不支持任意输入天数。会员范围按物料模板固定，DIY 不向 VIP 开放。</p>')}${section('03','配套基础素材','<div id="gAssets"></div><p class="hint" style="margin-top:12px">至少选择一款基础素材，用户达标后自动可用。未选中的素材可通过运营策略投放，仍继承本类型门槛。</p>')}${section('04','成长权益适用范围',scope(existing||{}))}${section('05','物料标展示',markFields(existing||{},true))}<div class="notice">生效路径：命中艺人范围 → 类型和素材已上架 → 成长配置发布 → 当前艺人守护天数与会员身份达标 → 基础素材自动可用。</div></div><div class="drawer-foot"><span class="subtle">本地演示，不发布到线上</span><button class="right" onclick="closeModal()">取消</button><button id="gDraft">保存草稿</button><button class="primary" id="gPublish">发布成长权益</button></div></div></div>`;const refresh=()=>{const t=type($('#gType').value),g=db.growth[t.id+'@'+days]||db.growth[t.id];$('#gIdentity').innerHTML=t.template==='外显装扮'?'会员范围：<b>VIP / SVIP</b> · function numericEditor(typeId,days=1,id){const old=numericGrowth.find(g=>g.id===id),r=old||{},t=type(typeId||r.type);$('#modal').innerHTML=`<div class="overlay"><div class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><h2>配置数值类成长权益</h2><button class="right" onclick="closeModal()">关闭</button></div><div class="drawer-body"><div id="numericErrors"></div>${section('01','权益类型',field('权益类型',select('nType',db.types.map(t=>[t.id,t.name]),t.id))+'<div class="locked">数值类 · 无需素材 · 仅成长权益<br>业务能力：'+esc(t.numberBinding)+'。不支持日常运营加名额。</div>')}${section('02','成长节点与数值',field('成长节点',select('nDay',stages.map(n=>[String(n.days),n.label]),String(r.days||days)))+field('节点总上限（'+esc(t.unit)+'）','<input id="nValue" type="number" min="1" step="1" value="'+(r.value||'')+'">','填写该节点可用总量，不是本节点新增量。例如 D1 配 1、D11 配 2，则 D11 总共可用 2 个。')+'<div class="locked">会员：SVIP；按当前艺人守护天数，取已达成的最高有效节点总上限，不将各节点相加。</div>')}${section('03','适用范围',scope(r))}${section('04','梯度解锁标',markFields(r,true))}</div><div class="drawer-foot"><span class="subtle">本地演示，刷新重置</span><button id="nDraft" class="right">保存草稿</button><button id="nPublish" class="primary">发布成长权益</button></div></div></div>`;bindMark();$('#nType').onchange=()=>{const t2=type($('#nType').value);if(t2.valueKind==='number')numericEditor(t2.id,Number($('#nDay').value));else growthEditor(t2.id,Number($('#nDay').value))};bindAudienceScope();if(old){$('#nType').disabled=true;if(old.status==='已发布'){$('#nDay').disabled=true;$('#nDraft').disabled=true}}const save=draft=>{const f=readForm(),value=Number($('#nValue').value),day=Number($('#nDay').value),e=[];validateArtistScope(f,e);if(!Number.isSafeInteger(value)||value<1)e.push('总上限必须为正整数。');if(!f.markText||Array.from(f.markText).length>8)e.push('标文案须为 1—8 个字符。');if(numericGrowth.some(g=>g.id!==id&&g.type===t.id&&g.days===day))e.push('该类型在此节点已有配置，请编辑已有配置。');if(!draft){if(t.status!=='已上架')e.push('请先上架权益类型。');if(old?.status==='已发布'&&value<old.value)e.push('已发布的总上限不能直接降低，需另行处理存量权益。');const others=numericGrowth.filter(g=>g.id!==id&&g.type===t.id&&g.status==='已发布');if(others.some(g=>g.days<day&&g.value>value||g.days>day&&g.value<value))e.push('节点总上限须随成长梯度不递减。');}if(e.length){$('#numericErrors').innerHTML='<div class="error">'+e.map(esc).join('<br>')+'</div>';$('.drawer-body').scrollTop=0;return}const row={...f,id:id||'NG'+Date.now(),type:t.id,days:day,value,markKind:'梯度解锁标',status:draft?'草稿':'已发布'};const i=numericGrowth.findIndex(g=>g.id===id);if(i<0)numericGrowth.push(row);else numericGrowth[i]=row;closeModal();renderGrowth();toast('数值类成长权益已保存（本地演示）')};$('#nDraft').onclick=()=>save(true);$('#nPublish').onclick=()=>save(false)}
